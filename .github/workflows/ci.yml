name: Verify Blue
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flutter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn
        if: runner.os == 'Linux'
      - run: flutter build apk --debug
        if: runner.os == 'Linux'
      - run: flutter build windows --release
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: blue-${{ runner.os }}-research
          path: |
            apps/client/build/app/outputs/flutter-apk/app-debug.apk
            apps/client/build/windows/x64/runner/Release/
            apps/client/build/web/
          if-no-files-found: error
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
